<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18212b"><title>Trent Progress Report</title><style>:root{--ink:#18212b;--paper:#f3ecdc;--card:#fffdf8;--line:#d8caa8;--amber:#e39a2f;--green:#2f6b4f}*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--paper);color:var(--ink);font:14px Arial,sans-serif;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}.wrap{max-width:900px;margin:auto}.head{background:var(--ink);color:#fff;padding:20px;border-radius:12px;border-bottom:5px solid var(--amber);margin-bottom:12px}h1{margin:0;font-size:26px}.eyebrow{color:var(--amber);font:700 10px monospace;text-transform:uppercase;letter-spacing:.1em}.sub{color:#ccc;margin-top:5px;font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:15px;margin:12px 0;box-shadow:0 4px 14px #18212b10}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}label{display:block;color:#69727d;font:700 10px monospace;text-transform:uppercase;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}textarea{min-height:80px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}@media(max-width:600px){.actions{grid-template-columns:1fr}}button{padding:12px;border-radius:8px;border:1px solid var(--ink);background:#fff;font-weight:700}button.primary{background:var(--amber);border-color:#9b6418}.dark{background:var(--ink);color:var(--amber)}.photo{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:9px;margin-top:9px;border:1px dashed var(--line);border-radius:9px}.photo img{width:110px;height:110px;object-fit:cover;border-radius:7px}.mono{font:10px monospace;color:#69727d}.summary{background:#eef5f0;border:1px solid #bfd6c7;padding:10px;border-radius:8px}.hidden{display:none}</style></head><body><div class="wrap"><header class="head"><div class="eyebrow">Advanced Site Documentation</div><h1>Trent Progress Report</h1><div class="sub">Construction / interior work progress report generator</div></header><section class="card"><div class="grid"><div><label>Project name</label><input id="project" placeholder="Project / site name"></div><div><label>Project manager</label><input id="manager"></div><div><label>Site engineer</label><input id="engineer"></div><div><label>Location</label><input id="location"></div><div><label>Report date</label><input id="date" type="date"></div><div><label>Carpet area</label><input id="area" placeholder="e.g. 45,000 sq.ft"></div><div><label>Building type</label><select id="building"><option>Mall</option><option>Standalone</option><option>Shed</option></select></div><div><label>Floors</label><select id="floors"><option>Single Floor</option><option>G+1</option><option>G+2</option><option>G+3</option></select></div></div></section><section class="card"><div class="grid"><div><label>Overall progress %</label><input id="progress" type="number" min="0" max="100" value="0"></div><div><label>Status</label><select id="status"><option>On Track</option><option>At Risk</option><option>Delayed</option><option>Completed</option><option>On Hold</option></select></div><div><label>Key highlights</label><textarea id="highlights"></textarea></div><div><label>Next activities</label><textarea id="next"></textarea></div></div></section><section class="card"><div class="actions"><button class="dark" onclick="cam.click()">📸 Take photo</button><button class="dark" onclick="lib.click()">🖼️ Choose photos</button></div><input id="cam" type="file" accept="image/*" capture="environment" class="hidden"><input id="lib" type="file" accept="image/*" multiple class="hidden"><div id="gallery"></div><div id="count" class="mono" style="margin-top:8px">0 PHOTOS</div></section><section class="card"><div class="actions"><button class="primary" onclick="makePpt()">Generate PPTX</button><button class="primary" onclick="makePdf()">Generate PDF</button></div><div class="summary" id="summary" style="margin-top:10px">Add project information and photos.</div></section></div><script>const photos=[];const $=id=>document.getElementById(id);date.value=new Date().toISOString().slice(0,10);function read(f){return new Promise((r,j)=>{let x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}async function add(fs){for(const f of fs){const src=await read(f);photos.push({src,note:'',area:'',time:new Date()});render()}}cam.onchange=e=>add(e.target.files);lib.onchange=e=>add(e.target.files);function render(){gallery.innerHTML='';photos.forEach((p,i)=>{let d=document.createElement('div');d.className='photo';d.innerHTML=`<img src="${p.src}"><div><label>Area / floor / room</label><input value="${p.area}" oninput="photos[${i}].area=this.value"><label style="margin-top:7px">Progress note</label><textarea oninput="photos[${i}].note=this.value">${p.note}</textarea><button style="margin-top:7px" onclick="photos.splice(${i},1);render()">Remove</button></div>`;gallery.appendChild(d)});count.textContent=photos.length+' PHOTO'+(photos.length==1?'':'S');summary.textContent=`${project.value||'Project'} • ${photos.length} photo${photos.length==1?'':'s'} • ${progress.value||0}% complete`}['project','manager','engineer','location','date','area','building','floors','progress','status','highlights','next'].forEach(id=>$(id).oninput=render);render();const pptUrl='https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',pdfUrl='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';function load(u,test){return new Promise((ok,no)=>{if(test())return ok();let s=document.createElement('script');s.src=u;s.onload=()=>test()?ok():no();s.onerror=no;document.head.appendChild(s)})}async function makePpt(){if(!photos.length)return alert('Add at least one photo.');await load(pptUrl,()=>!!window.PptxGenJS);let P=new PptxGenJS();P.layout='LAYOUT_WIDE';let s=P.addSlide();s.background={color:'18212B'};s.addText('TRENT SITE PROGRESS REPORT',{x:.7,y:.55,w:7,h:.4,fontSize:12,bold:true,color:'E39A2F'});s.addText(project.value||'PROJECT NAME',{x:.7,y:1.25,w:11.5,h:.7,fontSize:28,bold:true,color:'FFFFFF'});s.addText(`Manager: ${manager.value||'—'}\nEngineer: ${engineer.value||'—'}\nLocation: ${location.value||'—'}\nDate: ${date.value||'—'}\nProgress: ${progress.value||0}% • ${status.value}`,{x:.7,y:2.2,w:6,h:2.2,fontSize:15,color:'FFFFFF'});s.addText(highlights.value||'No highlights entered.',{x:7,y:2.2,w:5.4,h:2.2,fontSize:14,color:'FFFFFF'});for(let i=0;i<photos.length;i++){let p=photos[i],q=P.addSlide();q.addText(`PHOTO ${i+1} • ${p.area||'General'}`,{x:.6,y:.45,w:8,h:.35,fontSize:12,bold:true,color:'E39A2F'});q.addImage({data:p.src,x:.6,y:1,w:12.1,h:5.4});if(p.note)q.addText(p.note,{x:.7,y:6.55,w:11.8,h:.45,fontSize:10,color:'18212B'})}let t=P.addSlide();t.background={color:'18212B'};t.addText('THANK YOU',{x:1,y:2.8,w:11,h:.8,fontSize:40,bold:true,color:'FFFFFF',align:'center'});await P.writeFile({fileName:(project.value||'Trent_Report').replace(/[^\w-]+/g,'_')+'.pptx'})}async function makePdf(){if(!photos.length)return alert('Add at least one photo.');await load(pdfUrl,()=>!!window.jspdf?.jsPDF);const {jsPDF}=window.jspdf,D=new jsPDF({unit:'in',format:[10,5.63],orientation:'landscape'});D.setFillColor(24,33,43);D.rect(0,0,10,5.63,'F');D.setTextColor(227,154,47);D.setFontSize(10);D.text('TRENT SITE PROGRESS REPORT',.7,.7);D.setTextColor(255,255,255);D.setFont('times','bold');D.setFontSize(27);D.text(project.value||'PROJECT NAME',.7,1.6,{maxWidth:8.6});D.setFont('helvetica');D.setFontSize(12);D.text(`Manager: ${manager.value||'—'}`,.7,2.5);D.text(`Engineer: ${engineer.value||'—'}`,.7,2.85);D.text(`Location: ${location.value||'—'}`,.7,3.2);D.text(`Progress: ${progress.value||0}% • ${status.value}`,.7,3.55);D.text(highlights.value||'No highlights entered.',5.3,2.5,{maxWidth:4});for(const p of photos){D.addPage([10,5.63],'landscape');D.addImage(p.src,p.src.startsWith('data:image/png')?'PNG':'JPEG',0,0,10,5.0);if(p.note)D.text(p.note,0.4,5.35,{maxWidth:9.2})}D.addPage([10,5.63],'landscape');D.setFillColor(24,33,43);D.rect(0,0,10,5.63,'F');D.setTextColor(255,255,255);D.setFont('times','bold');D.setFontSize(40);D.text('THANK YOU',5,3,{align:'center'});D.save((project.value||'Trent_Report').replace(/[^\w-]+/g,'_')+'.pdf')}</script></body></html>
