<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trent Advanced Site Progress Report</title>
<style>:root{--ink:#18212b;--muted:#69727d;--paper:#f3ecdc;--card:#fffdf8;--line:#d8caa8;--amber:#e39a2f;--amber2:#9b6418;--green:#2f6b4f;--red:#b13f2a}*{box-sizing:border-box}body{margin:0;padding:14px;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}.wrap{max-width:760px;margin:auto}.head{background:var(--ink);color:#fff;padding:20px;border-radius:12px;margin-bottom:14px;border-bottom:5px solid var(--amber)}h1{font-size:27px;margin:0 0 5px;text-transform:uppercase}.eyebrow,label,.mono{font-family:ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em}.eyebrow{color:var(--amber);font-size:11px}.sub{color:#c7c1b5;font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}@media(max-width:560px){.grid,.actions{grid-template-columns:1fr}}label{font-size:10px;color:var(--muted);display:block;margin-bottom:6px;font-weight:700}input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:75px;resize:vertical}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:12px;border-radius:8px;font-weight:700;font-size:14px}button.primary{background:var(--amber);border-color:var(--amber2);color:#241804}button.dark{background:var(--ink);color:var(--amber)}button.red{background:#fff0ed;color:var(--red);border-color:#d99b8e}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-title strong{font-size:15px}.photo{position:relative;border:1px dashed var(--line);background:var(--paper);border-radius:8px;overflow:hidden;margin-top:9px}.photo img{width:100%;display:block}.photo .x{position:absolute;right:6px;top:6px;border:0;background:#fff;padding:4px 8px;border-radius:6px}.hidden{display:none}.status{font-size:12px;color:var(--muted);margin-top:8px}.meter{height:10px;background:#e7dfcc;border-radius:99px;overflow:hidden}.meter>i{display:block;height:100%;background:var(--green);width:0}.small{font-size:11px;color:var(--muted)}.footer{padding:4px 2px 20px;text-align:center;font-size:10px;color:var(--muted)}
</style></head><body><main class="wrap"><header class="head"><div class="eyebrow">TRENT / ADVANCED FIELD TOOL</div><h1>Site Progress Report</h1><div class="sub">Offline-first field capture • photo/video evidence • PDF + PPTX export</div></header>
<section class="card"><div class="section-title"><strong>Project information</strong><span class="mono small">01</span></div><div class="grid"><div><label>Project</label><input id="project" placeholder="Project name"></div><div><label>Location</label><input id="location" placeholder="Site location"></div><div><label>Project manager</label><input id="projectManager" placeholder="Name"></div><div><label>Site engineer</label><input id="prepared" placeholder="Name"></div><div><label>Report date</label><input id="date" type="date"></div><div><label>Overall progress (%)</label><input id="overall" type="number" min="0" max="100" value="0"></div></div><div style="margin-top:12px"><div class="meter"><i id="bar"></i></div></div></section>
<section class="card"><div class="section-title"><strong>Progress summary</strong><span class="mono small">02</span></div><label>Completed / key highlights</label><textarea id="completed" placeholder="Describe completed works, quantities, milestones and observations..."></textarea><label style="margin-top:10px">Next activities</label><textarea id="next" placeholder="Upcoming work, dependencies, inspections..."></textarea></section>
<section class="card"><div class="section-title"><strong>Photo & video evidence</strong><span class="mono small">03</span></div><div class="grid"><div><label>Evidence category</label><select id="category"><option>General progress</option><option>Civil works</option><option>Structure</option><option>MEP</option><option>Finishes</option><option>Safety</option><option>Materials</option><option>Defect / issue</option></select></div><div><label>Evidence location</label><input id="photoLocation" placeholder="Block / floor / grid"></div></div><label style="margin-top:10px">Evidence note</label><input id="photoNote" placeholder="What does this evidence show?"><div class="actions" style="margin-top:10px"><button class="primary" id="cameraBtn">Capture photo</button><button id="photoBtn">Choose photos</button></div><input id="photoInput" class="hidden" type="file" accept="image/*" multiple><div class="actions" style="margin-top:10px"><button id="videoBtn">Choose / record video</button><button class="red" id="clearBtn">Clear evidence</button></div><input id="videoInput" class="hidden" type="file" accept="video/*" multiple><div id="gallery"></div><div id="videoList" class="status"></div></section>
<section class="card"><div class="section-title"><strong>Report branding</strong><span class="mono small">04</span></div><div class="grid"><div><label>Company logo</label><input id="logoInput" type="file" accept="image/*"></div><div><label>Logo corner</label><select id="corner"><option value="tr">Top right</option><option value="tl">Top left</option><option value="br">Bottom right</option><option value="bl">Bottom left</option></select></div><div><label>Photo timestamp</label><select id="stamp"><option value="on">Stamp capture time</option><option value="off">Do not stamp</option></select></div></div></section>
<section class="card"><div class="section-title"><strong>Export & share</strong><span class="mono small">05</span></div><div class="actions"><button class="primary" id="ppt">Generate PPTX</button><button class="dark" id="pdf">Generate PDF</button></div><div class="actions" style="margin-top:10px"><button id="shareBtn">Share latest report</button><a id="pptDownload" class="hidden" href="#">Download PPTX</a><a id="pdfDownload" class="hidden" href="#">Download PDF</a></div><div id="status" class="status">Ready.</div></section><footer class="footer">Trent Advanced Site Progress Report</footer></main>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script>
const $=id=>document.getElementById(id);let photos=[],videos=[],logo='',lastFiles={};$('date').value=new Date().toISOString().slice(0,10);function updateSummary(){const n=Math.max(0,Math.min(100,Number($('overall').value)||0));$('bar').style.width=n+'%'}$('overall').oninput=updateSummary;function addPhoto(src){photos.push({src,category:$('category').value,location:$('photoLocation').value,note:$('photoNote').value,capturedAt:new Date()});render()}function render(){const g=$('gallery');g.innerHTML=photos.map((p,i)=>`<div class="photo"><img src="${p.src}"><button class="x" onclick="photos.splice(${i},1);render()">×</button></div>`).join('');$('videoList').textContent=videos.length?videos.length+' video file(s) ready for report.':''}function readFiles(files){[...files].forEach(f=>{if(f.type.startsWith('image/')){const r=new FileReader();r.onload=()=>addPhoto(r.result);r.readAsDataURL(f)}else if(f.type.startsWith('video/')){const r=new FileReader();r.onload=()=>{videos.push({src:r.result,name:f.name,mime:f.type});render()};r.readAsDataURL(f)}})}$('photoInput').onchange=e=>readFiles(e.target.files);$('videoInput').onchange=e=>readFiles(e.target.files);$('photoBtn').onclick=()=>$('photoInput').click();$('videoBtn').onclick=()=>$('videoInput').click();$('clearBtn').onclick=()=>{photos=[];videos=[];render()};$('cameraBtn').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.capture='environment';i.onchange=e=>readFiles(e.target.files);i.click()};$('logoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>logo=r.result;r.readAsDataURL(f)};function safeName(){return($('project').value||'Trent_Report').replace(/[^\w-]+/g,'_')}function dims(src){return new Promise(r=>{const i=new Image();i.onload=()=>r([i.naturalWidth,i.naturalHeight]);i.src=src})}function pos(c,W,H,w,h,m){return c==='tr'?[W-w-m,m]:c==='tl'?[m,m]:c==='br'?[W-w-m,H-h-m]:[m,H-h-m]}async function stamped(src,p){if($('stamp').value==='off')return src;const im=new Image();im.src=src;await new Promise(r=>im.onload=r);const c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=im.naturalWidth;c.height=im.naturalHeight;ctx.drawImage(im,0,0);const dt=new Date(p.capturedAt),txt='Captured: '+dt.toLocaleDateString('en-IN')+' '+dt.toLocaleTimeString('en-IN',{hour12:false});const sz=Math.max(18,Math.round(c.width/55));ctx.font='700 '+sz+'px Arial';const pad=Math.round(sz*.65),tw=ctx.measureText(txt).width;ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,c.height-sz-pad*2,tw+pad*2,sz+pad*2);ctx.fillStyle='#fff';ctx.fillText(txt,pad,c.height-sz-pad*.65);return c.toDataURL('image/jpeg',.92)}function base64(ab){let s='',u=new Uint8Array(ab);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode(...u.subarray(i,i+0x8000));return btoa(s)}function nativeSave(name,mime,ab){if(window.AndroidBridge)AndroidBridge.saveFile(name,mime,base64(ab))}function nativeShare(name,mime,ab){if(window.AndroidBridge)AndroidBridge.shareFile(name,mime,base64(ab))}
async function makePpt(){if(!photos.length&&!videos.length)throw Error('Add at least one photo or video.');const P=new PptxGenJS();P.layout='LAYOUT_WIDE';const W=13.333,H=7.5;s=P.addSlide();s.background={color:'18212B'};if(logo)s.addImage({data:logo,x:11.6,y:.35,w:1.1,h:1.1});s.addText('TRENT',{x:.7,y:.4,w:4,h:.5,fontSize:28,bold:true,color:'FFFFFF'});s.addText('SITE PROGRESS REPORT',{x:.7,y:1.0,w:5,h:.3,fontSize:10,bold:true,color:'E39A2F'});s.addText($('project').value||'PROJECT NAME',{x:.7,y:1.65,w:11.5,h:1,fontFace:'Times New Roman',fontSize:34,bold:true,color:'FFFFFF',fit:'shrink'});s.addText('PROJECT MANAGER',{x:.7,y:2.7,w:2.5,h:.2,fontSize:9,bold:true,color:'E39A2F'});s.addText($('projectManager').value||'—',{x:.7,y:2.95,w:5,h:.35,fontSize:15,bold:true,color:'FFFFFF'});s.addText('SITE ENGINEER',{x:6.6,y:2.7,w:2.5,h:.2,fontSize:9,bold:true,color:'E39A2F'});s.addText($('prepared').value||'—',{x:6.6,y:2.95,w:5,h:.35,fontSize:15,bold:true,color:'FFFFFF'});s.addText('OVERALL PROGRESS '+($('overall').value||0)+'%',{x:.7,y:4.0,w:5,h:.4,fontSize:17,bold:true,color:'E39A2F'});s.addText('LOCATION  '+($('location').value||'—'),{x:.7,y:4.6,w:7,h:.3,fontSize:11,color:'D8D2C6'});let k=P.addSlide();k.background={color:'FFFFFF'};k.addText('PROJECT PROGRESS',{x:.7,y:.6,w:5,h:.3,fontSize:11,bold:true,color:'E39A2F'});k.addText('KEY HIGHLIGHTS OF PROJECT',{x:.7,y:1.1,w:10,h:.5,fontSize:23,bold:true,color:'18212B'});k.addText($('completed').value||'No key highlights entered.',{x:.8,y:1.7,w:11.7,h:3.5,fontSize:16,color:'18212B',fit:'shrink'});k.addText('NEXT ACTIVITIES',{x:.8,y:5.35,w:4,h:.25,fontSize:9,bold:true,color:'2F6B4F'});k.addText($('next').value||'—',{x:.8,y:5.65,w:11.7,h:.65,fontSize:11,color:'18212B',fit:'shrink'});for(let i=0;i<photos.length;i++){const p=photos[i],src=await stamped(p.src,p),[iw,ih]=await dims(src),sl=P.addSlide();sl.background={color:'FFFFFF'};const ah=p.note?6.2:7.2,ar=W/ah,ir=iw/ih;let w,h,x,y;if(ir>ar){w=W;h=W/ir;x=0;y=(ah-h)/2}else{h=ah;w=ah*ir;y=0;x=(W-w)/2}sl.addImage({data:src,x,y,w,h});sl.addText((i+1)+'. '+p.category+(p.location?' • '+p.location:''),{x:.35,y:7.2,w:7,h:.2,fontSize:9,color:'69727D'});if(p.note)sl.addText(p.note,{x:7,y:6.55,w:5.9,h:.55,fontSize:10,color:'18212B',fit:'shrink'});if(logo){const q=pos($('corner').value,W,H,.75,.75,.2);sl.addImage({data:logo,x:q[0],y:q[1],w:.75,h:.75})}}for(let i=0;i<videos.length;i++){const v=videos[i],sl=P.addSlide();sl.background={color:'FFFFFF'};sl.addText('PROJECT PROGRESS • VIDEO DOCUMENTATION',{x:.65,y:.45,w:8,h:.3,fontSize:10,bold:true,color:'E39A2F'});sl.addText(v.name,{x:.65,y:.9,w:11,h:.45,fontSize:18,bold:true,color:'18212B'});sl.addShape(P.ShapeType.rect,{x:.7,y:1.55,w:11.95,h:4.55,fill:{color:'F1F1F1'},line:{color:'D9CBA7'}});sl.addText('VIDEO CAPTURED',{x:3.5,y:3.4,w:6,h:.4,fontSize:22,bold:true,color:'18212B',align:'center'})}let t=P.addSlide();t.background={color:'18212B'};if(logo)t.addImage({data:logo,x:11.55,y:.4,w:1.15,h:1.15});t.addText('THANK YOU',{x:1,y:2.7,w:11.3,h:1,fontFace:'Times New Roman',fontSize:42,bold:true,color:'FFFFFF',align:'center'});t.addText($('project').value||'Project Name',{x:2,y:3.8,w:9.3,h:.45,fontSize:14,color:'D8D2C6',align:'center'});const name=safeName()+'.pptx',ab=await P.write({outputType:'arraybuffer'});lastFiles.ppt={name,mime:'application/vnd.openxmlformats-officedocument.presentationml.presentation',ab};nativeSave(name,lastFiles.ppt.mime,ab);return new Blob([ab],{type:lastFiles.ppt.mime})}
async function makePdf(){if(!photos.length)throw Error('Add at least one photo.');const {jsPDF}=window.jspdf,D=new jsPDF({unit:'in',format:[10,5.63],orientation:'landscape'}),W=10,H=5.63;D.setFillColor(24,33,43);D.rect(0,0,W,H,'F');D.setTextColor(227,154,47);D.setFontSize(10);D.text('TRENT SITE PROGRESS REPORT',.7,.7);D.setTextColor(255,255,255);D.setFont('times','bold');D.setFontSize(28);D.text($('project').value||'PROJECT NAME',.7,1.65,{maxWidth:8.7});D.setFont('helvetica','bold');D.setFontSize(9);D.setTextColor(227,154,47);D.text('PROJECT MANAGER',.7,2.55);D.text('SITE ENGINEER',5.35,2.55);D.setTextColor(255,255,255);D.setFontSize(14);D.text($('projectManager').value||'—',.7,2.85);D.text($('prepared').value||'—',5.35,2.85);D.setTextColor(227,154,47);D.setFontSize(9);D.text('OVERALL PROGRESS '+($('overall').value||0)+'%',.7,3.55);D.text('LOCATION',5.35,3.55);D.setTextColor(255,255,255);D.setFontSize(11);D.text($('location').value||'—',5.35,3.82);D.addPage([W,H],'landscape');D.setTextColor(24,33,43);D.setFont('helvetica','bold');D.setFontSize(22);D.text('KEY HIGHLIGHTS OF PROJECT',.7,.75);D.setFont('helvetica','normal');D.setFontSize(13);D.text(D.splitTextToSize($('completed').value||'No key highlights entered.',8.5),.8,1.45);for(let i=0;i<photos.length;i++){const p=photos[i],src=await stamped(p.src,p),[iw,ih]=await dims(src);D.addPage([W,H],'landscape');const ah=p.note?4.55:5.63,ar=W/ah,ir=iw/ih;let w,h,x,y;if(ir>ar){w=W;h=W/ir;x=0;y=(ah-h)/2}else{h=ah;w=ah*ir;y=0;x=(W-w)/2}D.addImage(src,src.startsWith('data:image/png')?'PNG':'JPEG',x,y,w,h);D.setFontSize(9);D.setTextColor(70);D.text((i+1)+'. '+p.category+(p.location?' • '+p.location:''),.25,5.48);if(p.note){D.setFontSize(9);D.setTextColor(24,33,43);D.text(D.splitTextToSize(p.note,5.7),4.0,4.9)}}D.addPage([W,H],'landscape');D.setFillColor(24,33,43);D.rect(0,0,W,H,'F');D.setTextColor(255,255,255);D.setFont('times','bold');D.setFontSize(40);D.text('THANK YOU',5,3,{align:'center'});D.setFont('helvetica','normal');D.setFontSize(12);D.text($('project').value||'Project Name',5,3.65,{align:'center'});const name=safeName()+'.pdf',ab=D.output('arraybuffer');lastFiles.pdf={name,mime:'application/pdf',ab};nativeSave(name,lastFiles.pdf.mime,ab);return new Blob([ab],{type:lastFiles.pdf.mime})}function setupDownload(a,file){a.onclick=e=>{e.preventDefault();const u=URL.createObjectURL(file);const x=document.createElement('a');x.href=u;x.download=file.name;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}}$('ppt').onclick=async()=>{try{$('status').textContent='Generating PPTX…';const b=await makePpt();setupDownload($('pptDownload'),lastFiles.ppt&&b);$('downloadArea')?.classList.remove('hidden');$('status').textContent='PPTX saved to Downloads.'}catch(e){$('status').textContent=e.message}};$('pdf').onclick=async()=>{try{$('status').textContent='Generating PDF…';const b=await makePdf();setupDownload($('pdfDownload'),b);$('status').textContent='PDF saved to Downloads.'}catch(e){$('status').textContent=e.message}};$('shareBtn').onclick=()=>{const f=lastFiles.ppt||lastFiles.pdf;if(!f)return alert('Generate a report first.');nativeShare(f.name,f.mime,f.ab)};render();updateSummary();
</script></body></html>
